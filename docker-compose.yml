services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
      POSTGRES_DB: rpg_db
    ports:
      - "5450:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg_user -d rpg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6400:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: runtime
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
      POSTGRES_DB: rpg_db
      REDIS_HOST: redis
      SECRET_KEY: "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7"
    ports:
      - "8020:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  backend-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: test
    profiles:
      - test
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
      POSTGRES_DB: rpg_db
      REDIS_HOST: redis
      SECRET_KEY: "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7"
      RUN_BACKEND_TESTS: ${RUN_BACKEND_TESTS:-true}
      PYTEST_ARGS: ${PYTEST_ARGS:-tests -q}
    command: >
      sh -c "if [ \"$$RUN_BACKEND_TESTS\" = \"true\" ]; then
      python -m pytest $$PYTEST_ARGS;
      else
      echo 'RUN_BACKEND_TESTS=false, skipping backend tests.';
      fi"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    restart: always
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_HMR_PORT=3020
    command: sh -c "pnpm install --config.@civic:registry=http://host.docker.internal:4873 && pnpm dev"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3020:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/host/node_modules
      - /app/apps/player-view/node_modules
      - /app/packages/bridge/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/types/node_modules
      - /app/packages/dm-view/node_modules
      - /app/packages/shared/node_modules
      # Mount the live design system from the external repo
      - ../civic/packages/design-system:/app/vendor/design-system
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
