services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
      POSTGRES_DB: rpg_db
    ports:
      - "5450:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg_user -d rpg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6400:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: runtime
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
      POSTGRES_DB: rpg_db
      REDIS_HOST: redis
      SECRET_KEY: "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7"
    ports:
      - "8020:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  backend-test:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: test
    profiles:
      - test
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: rpg_user
      POSTGRES_PASSWORD: rpg_password
      POSTGRES_DB: rpg_db
      REDIS_HOST: redis
      SECRET_KEY: "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7"
      FRONTEND_TYPES_DIR: /workspace/frontend/packages/types
      RUN_JSON_FIXTURE_CHECKS: ${RUN_JSON_FIXTURE_CHECKS:-true}
      RUN_CONTRACT_CHECKS: ${RUN_CONTRACT_CHECKS:-true}
      RUN_BACKEND_TESTS: ${RUN_BACKEND_TESTS:-true}
      PYTEST_ARGS: ${PYTEST_ARGS:-tests -q}
    volumes:
      - ./backend:/app
      - ./frontend/packages/types:/workspace/frontend/packages/types
    command: >
      sh -c "if [ \"$$RUN_JSON_FIXTURE_CHECKS\" = \"true\" ]; then
      python scripts/validate_fixture_json.py;
      else
      echo 'RUN_JSON_FIXTURE_CHECKS=false, skipping fixture JSON validation.';
      fi &&
      if [ \"$$RUN_CONTRACT_CHECKS\" = \"true\" ]; then
      python scripts/generate_types.py --check;
      else
      echo 'RUN_CONTRACT_CHECKS=false, skipping contract drift check.';
      fi &&
      if [ \"$$RUN_BACKEND_TESTS\" = \"true\" ]; then
      python -m pytest $$PYTEST_ARGS;
      else
      echo 'RUN_BACKEND_TESTS=false, skipping backend tests.';
      fi"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    restart: always
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_HMR_PORT=3020
      - VITE_FRONTEND_TESTING_DM_PROXY_DOCK=true
    command: sh -c "pnpm install --config.confirmModulesPurge=false && ln -sfn /app/packages/ui/node_modules /civic/node_modules && pnpm dev"
    ports:
      - "3020:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/apps/host/node_modules
      - /app/apps/player-view/node_modules
      - /app/packages/bridge/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/types/node_modules
      - /app/packages/dm-view/node_modules
      - /app/packages/shared/node_modules
      # Mount the live design system packages at the path expected by pnpm-workspace.yaml
      - ../civic/packages/design-system:/civic/packages/design-system
      - ../civic/packages/civic-react-v2:/civic/packages/civic-react-v2
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
